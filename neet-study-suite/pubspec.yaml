name: neet_study_suite
description: Comprehensive NEET-PG 2026 study suite — QBank, Flashcards, Mock Tests, AI Tutor.

publish_to: 'none'

version: 1.6.0+10

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Networking
  http: ^1.2.0
  # AI
  google_generative_ai: ^0.4.3
  # Local storage
  shared_preferences: ^2.2.3
  drift: ^2.18.0
  drift_flutter: ^0.2.2
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0
  # Voice
  flutter_tts: ^4.0.2
  speech_to_text: ^7.0.0
  # State management
  flutter_riverpod: ^2.5.1
  # UI utilities
  intl: ^0.19.0
  percent_indicator: ^4.2.3
  fl_chart: ^0.68.0
  shimmer: ^3.0.0
  # Markdown rendering (AI Tutor responses)
  flutter_markdown: ^0.7.3
  # Utils
  uuid: ^4.4.0
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  drift_dev: ^2.18.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/logo.png
    - assets/icon/app_icon.png
