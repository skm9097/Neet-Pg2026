name: Build Windows Desktop

# Builds the Windows installer (NSIS) for the neetpg-desktop-tauri app.
#
# Triggers:
#   - push to the dev / main branches that touches the desktop app source
#   - a tag like desktop-v2.1.4 → also publishes a GitHub Release with the .exe
#   - manual run from the Actions tab (workflow_dispatch); tick "publish_release"
#     to cut a Release without a tag
#   - a push whose head commit message contains "[release]" → also publishes
#     (tag-free path, mirrors the Android workflow; the tag desktop-v<version>
#     is created by softprops/action-gh-release at that commit)
#
# Built natively on a Windows runner: WebView2 ships with Windows and the Tauri
# CLI provisions the NSIS bundler, so no extra system setup is needed.

on:
  push:
    branches:
      - main
      - claude/add-claude-documentation-1xfan
    paths:
      - 'neetpg-desktop-tauri/**'
      - '.github/workflows/desktop-build.yml'
    tags:
      - 'desktop-v*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish a GitHub Release with the installer'
        type: boolean
        default: false

# Needed so the release step can create/upload a GitHub Release.
permissions:
  contents: write

# Cancel an in-flight run if a newer commit lands on the same ref.
concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_DIR: neetpg-desktop-tauri

jobs:
  build:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # Caches the src-tauri Cargo build so reruns are minutes, not ~15+ min.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.APP_DIR }}/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: ${{ env.APP_DIR }}
        run: npm ci

      # Version comes from package.json so the artifact / tag / release name
      # carry it without hardcoding.
      - name: Read app version
        id: ver
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Detected desktop version: $V"

      # Runs the config's beforeBuildCommand (tsc + vite build), compiles the
      # Rust core, and bundles the NSIS installer.
      - name: Build Tauri app (NSIS)
        working-directory: ${{ env.APP_DIR }}
        run: npx tauri build --bundles nsis

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: neetpg-desktop-v${{ steps.ver.outputs.version }}-setup
          path: |
            ${{ env.APP_DIR }}/src-tauri/target/release/bundle/nsis/*.exe
            ${{ env.APP_DIR }}/src-tauri/target/*/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

      # Publishes a GitHub Release with the installer attached, on a
      # desktop-v* tag, a dispatch with publish_release, or a [release] push.
      - name: Publish GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/desktop-v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')) }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/desktop-v') && github.ref_name || format('desktop-v{0}', steps.ver.outputs.version) }}
          name: ${{ startsWith(github.ref, 'refs/tags/desktop-v') && github.ref_name || format('NEET PG Desktop v{0}', steps.ver.outputs.version) }}
          files: |
            ${{ env.APP_DIR }}/src-tauri/target/release/bundle/nsis/*.exe
            ${{ env.APP_DIR }}/src-tauri/target/*/release/bundle/nsis/*.exe
          generate_release_notes: true
